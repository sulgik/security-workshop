model_list:
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: sk-workshop-2025   # 수강생 공유 키 (강의 당일 변경 가능)

litellm_settings:
  rpm_limit: 500     # 유료 key 기준 (20명 동시 사용 여유)
  drop_params: true  # Gemini 미지원 파라미터 자동 제거
  request_timeout: 60
